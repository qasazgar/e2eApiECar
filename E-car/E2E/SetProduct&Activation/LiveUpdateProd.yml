info:
  name: LiveUpdateProd
  type: http
  seq: 3

http:
  method: post
  url: "{{ecarURL}}/livewire-becf286a/update"
  headers:
    - name: accept
      value: "*/*"
    - name: content-type
      value: application/json
    - name: Cookie
      value: "{{Access}}"
    - name: origin
      value: "{{ecarURL}}"
    - name: referer
      value: "{{ecarURL}}/admin/products/create"
    - name: x-livewire
      value: "1"
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const snapshot = bru.getEnvVar("snapshot");
        const token = bru.getEnvVar("csrfToken");
        if (!snapshot || !token) throw new Error("Missing snapshot/csrfToken - run SelectProd first");

        // codes already used in earlier runs (kept as a JSON array in the environment)
        let usedCodes = [];
        try { usedCodes = JSON.parse(bru.getEnvVar("usedCodes") || "[]"); } catch (e) { usedCodes = []; }

        // generate a random 9-digit code; regenerate until it was never used before
        let code;
        let attempts = 0;
        do {
          code = String(Math.floor(100000000 + Math.random() * 900000000));
          attempts++;
          if (attempts > 100) throw new Error("Could not generate a unique code");
        } while (usedCodes.includes(code));

        usedCodes.push(code);
        bru.setEnvVar("usedCodes", JSON.stringify(usedCodes.slice(-200)));  // keep the last 200 only
        bru.setEnvVar("productCode", code);
        console.log("Generated unique code:", code, "(attempts:", attempts + ")");

        req.setBody({
          _token: token,
          components: [{
            snapshot: snapshot,
            updates: { "data.code": code, "data.product_type_id": "3" },
            calls: [{ method: "$commit", params: [], metadata: { type: "model.live" } }]
          }]
        });
    - type: after-response
      code: |-
        const comp = res.body.components[0];
        bru.setEnvVar("snapshot", comp.snapshot);   // always keep the latest snapshot

        const data = JSON.parse(comp.snapshot).data.data[0];
        const sentCode = bru.getEnvVar("productCode");
        const usedCodes = JSON.parse(bru.getEnvVar("usedCodes") || "[]");

        test("Live update accepted", () => {
          expect(res.status).to.equal(200);
          expect(res.body.components).to.be.an("array");
        });

        // test("Generated code is a 9-digit number", () => {
        //   expect(sentCode).to.match(/^\d{9}$/);
        // });

        // test("Code is not a duplicate of any previous run", () => {
        //   const count = usedCodes.filter(c => c === sentCode).length;
        //   expect(count).to.equal(1);
        // });

        // test("Server stored the same code that was sent", () => {
        //   expect(data.code).to.equal(sentCode);
        // });

        // test("Product type stored in component state", () => {
        //   expect(String(data.product_type_id)).to.equal("3");
        // });

        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
