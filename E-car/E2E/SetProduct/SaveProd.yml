info:
  name: SaveProd
  type: http
  seq: 5

http:
  method: post
  url: "{{ecarURL}}/livewire-becf286a/update"
  headers:
    - name: accept
      value: "*/*"
    - name: content-type
      value: application/json
    - name: Cookie
      value: "{{Access}}"
    - name: origin
      value: "{{ecarURL}}"
    - name: referer
      value: "{{ecarURL}}/admin/products/create"
    - name: x-livewire
      value: "1"
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const snapshot = bru.getEnvVar("snapshot");
        const token = bru.getEnvVar("csrfToken");

        if (!snapshot || !token) {
          throw new Error("Missing snapshot/csrfToken - run SelectProd and LiveUpdateProd first");
        }

        const vehicleNames = [
          // body type
          "سدان (Sedan)",
          "هاچبک (Hatchback)",
          "استیشن واگن (Station Wagon)",
          "کوپه (Coupe)",
          "کانورتیبل / رودستر (Convertible / Roadster)",
          "شاسی‌بلند (SUV)",
          "کراس‌اوور (Crossover)",
          "وَن / مینی‌ون (Van / Minivan)",
          "پیکاپ / وانت (Pickup Truck)",
          "لیفت‌بک (Liftback)",
          "اسپورت / سوپراسپرت (Sports Car / Supercar)",
          // fuel / engine type
          "بنزینی",
          "دیزلی",
          "گازسوز (CNG / LPG)",
          "هیبریدی (Hybrid)",
          "هیبریدی پلاگین (Plug-in Hybrid)",
          "برقی (Electric / EV)",
          "هیدروژنی (Fuel Cell)",
          // gearbox
          "دستی",
          "اتوماتیک",
          "دو کلاچه (DCT)",
          "بی‌پله (CVT)",
          // drive system
          "دیفرانسیل جلو (FWD)",
          "دیفرانسیل عقب (RWD)",
          "چهار چرخ محرک (AWD / 4WD)"
        ];

        const productName = vehicleNames[Math.floor(Math.random() * vehicleNames.length)];
        bru.setEnvVar("productName", productName);
        console.log("Random product name:", productName);

        req.setBody({
          _token: token,
          components: [
            {
              snapshot: snapshot,
              updates: {
                "data.name": productName
              },
              calls: [
                { method: "create", params: [], metadata: {} }
              ]
            }
          ]
        });
    - type: after-response
      code: |-
        const comp = res.body.components[0];
        const effects = comp.effects || {};
        const memo = JSON.parse(comp.snapshot).memo;

        console.log("memo.errors:", JSON.stringify(memo.errors));

        // fallback: pull error texts out of the re-rendered form
        if (effects.html) {
          const msgs = [...effects.html.matchAll(/<[^>]*class="[^"]*error[^"]*"[^>]*>\s*([^<]{3,})</g)]
            .map(m => m[1].trim());
          console.log("form errors:", JSON.stringify(msgs));
        }

        test("Product created - redirected to edit page", () => {
          expect(res.status).to.equal(200);
          expect(effects.redirect, "no redirect = not saved, see console").to.match(/\/admin\/products\/\d+\/edit/);
        });

        if (effects.redirect) {
          bru.setEnvVar("productEditUrl", effects.redirect);
          const m = effects.redirect.match(/products\/(\d+)\/edit/);
          if (m) bru.setEnvVar("productId", m[1]);
        }


        if (res.status === 200) {
          test("The viechle  Created successfully", () => {
            expect(res.status).to.equal(200);
             console.log("The viechle created successfully");
          });
        } else {
          test("The viechle was not created successfully", () => {
            expect(res.status).to.not.equal(200);
            console.log("The viechle was not distingushed selected successfully");
          });
        }



        test("Response time is less than 500ms", () => {
          expect(res.responseTime ).to.be.below(500);
          
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
