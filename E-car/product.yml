runtime:
  scripts:
    - type: before-request
      code: |-
        // List of sample car names to randomly choose from
        const carNames = [
            "پراید",
            "پژو 405",
            "پژو 206",
            "پژو 207",
            "پژو پارس",
            "سمند",
            "تیبا",
            "رنو تندر 90",
            "رنو ساندرو",
            "دنا",
            "کوییک",
            "شاهین",
            "مزدا 3",
            "هیوندای سوناتا",
            "کیا سراتو",
            "تویوتا کمری",
            "نیسان جوک"
        ];

        // Pick one at random
        const randomCarName = carNames[Math.floor(Math.random() * carNames.length)];

        // Save it as an environment variable (persists in the active environment)
        bru.setEnvVar("randomCarName", randomCarName);

        // Optional: log it to the Bruno console for debugging
        console.log("Selected car name:", randomCarName);
    - type: after-response
      code: |-
        // post-response script on the GET /admin/products/create request
        const html = res.getBody();

        // crude extraction — adjust the regex to match the actual attribute in the HTML
        const match = html.match(/wire:snapshot="([^"]+)"/);
        if (match) {
            const snapshot = match[1]
                .replace(/&quot;/g, '"')
                .replace(/&amp;/g, '&');
            bru.setEnvVar("Snapshot", snapshot);
            console.log("Captured fresh snapshot for CreateProduct page");
        } else {
            console.warn("Could not find wire:snapshot in page HTML — selector may need updating");
        }

